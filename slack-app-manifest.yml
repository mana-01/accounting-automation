_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Accounting Bot
  description: Automate invoice reconciliation with card and bank CSV statements
  background_color: "#1a73e8"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Accounting Bot
    always_online: true
  slash_commands:
    - command: /accounting-help
      description: Show help
      should_escape: false
    - command: /accounting-status
      description: Show current month accounting status
      usage_hint: "[YYYY-MM]"
      should_escape: false
    - command: /accounting-subscriptions
      description: List all subscriptions
      should_escape: false
    - command: /accounting-add-subscription
      description: Register a new subscription
      should_escape: false
    - command: /accounting-invoices
      description: List invoices
      usage_hint: "[YYYY-MM]"
      should_escape: false
    - command: /accounting-fetch-invoices
      description: Fetch invoices from email automatically
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - files:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - file_shared
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
