display_information:
  name: 経理自動化Bot
  description: カード・銀行明細CSVの照会と請求書管理を自動化
  background_color: "#1a73e8"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: 経理Bot
    always_online: true
  slash_commands:
    - command: /accounting-help
      description: ヘルプを表示
      usage_hint: ""
      should_escape: false
    - command: /accounting-status
      description: 今月の経理状況を表示
      usage_hint: "[YYYY年MM月]"
      should_escape: false
    - command: /accounting-subscriptions
      description: サブスクリプション一覧を表示
      usage_hint: ""
      should_escape: false
    - command: /accounting-add-subscription
      description: 新しいサブスクリプションを登録
      usage_hint: ""
      should_escape: false
    - command: /accounting-invoices
      description: 請求書一覧を表示
      usage_hint: "[YYYY年MM月]"
      should_escape: false
    - command: /accounting-fetch-invoices
      description: メールから請求書を自動取得
      usage_hint: ""
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - files:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - file_shared
      - message.channels
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
